<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>呷呼霸 - 員工專屬 App V8 (防呆除錯旗艦版)</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --brand-blue: #003b6d; --brand-blue-light: #e6f0f9; --brand-yellow: #ffc107;
            --bg: #fdfbf7; --text-main: #202124; --text-sub: #5f6368; --border: #dadce0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100%; background: var(--bg); position: relative; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;}
        
        #loginScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 30px; background: white; z-index: 100; position: absolute; width: 100%; }
        .logo-area { text-align: center; margin-bottom: 40px; }
        .logo-area h1 { color: var(--brand-blue); font-size: 40px; margin: 0; font-weight: 900; letter-spacing: 2px;}
        .logo-area p { color: var(--brand-yellow); background: var(--brand-blue); padding: 4px 12px; border-radius: 8px; font-size: 15px; margin-top: 8px; font-weight: bold; display: inline-block;}
        .login-input { width: 100%; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; outline: none; background: var(--bg); }
        .login-input:focus { border-color: var(--brand-blue); background: white; }
        .btn-login { width: 100%; padding: 16px; background: var(--brand-blue); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0,59,109,0.3); }

        #mainScreen { display: none; flex-direction: column; height: 100%; padding-bottom: 80px; }
        .header-bg { background: linear-gradient(135deg, #003b6d 0%, #002347 100%); padding: 25px 20px 20px 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,59,109,0.2); z-index: 10; }
        .app-title { font-weight: 900; color: var(--brand-yellow); font-size: 18px; margin-bottom: 15px;}
        .profile-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .profile-info { flex: 1; }
        .profile-info h2 { font-size: 26px; color: #ffffff; margin: 0 0 8px 0; font-weight: 800; letter-spacing: 1px;}
        .store-badge { display: inline-block; background: var(--brand-yellow); color: var(--brand-blue); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;}
        .profile-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-tiny { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; color: #ffffff; cursor: pointer; }
        .avatar-wrapper { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
        .user-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--brand-yellow); background: #eee; box-shadow: 0 3px 10px rgba(0,0,0,0.3); cursor: pointer;}
        .avatar-edit-badge { position: absolute; bottom: 0; right: 0; background: var(--brand-yellow); color: var(--brand-blue); border-radius: 50%; width: 24px; height: 24px; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold;}

        #punchWarning { display: none; background: #fce8e6; color: #c5221f; border-left: 5px solid #d93025; padding: 15px; margin: 20px 20px 0 20px; border-radius: 10px; font-size: 14px; font-weight: bold; box-shadow: 0 2px 8px rgba(217,48,37,0.1); animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .view-section { display: none; flex: 1; flex-direction: column; padding: 20px; overflow-y: auto;}
        .view-section.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 18px; font-weight: 900; color: var(--brand-blue); margin-bottom: 15px; border-left: 5px solid var(--brand-yellow); padding-left: 10px;}

        .punch-btn-wrapper { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; margin: 30px auto 15px auto;}
        .pulse-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--brand-yellow); animation: pulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
        .punch-btn { width: 150px; height: 150px; background: linear-gradient(135deg, #ffe066 0%, #ffc107 100%); border-radius: 50%; box-shadow: 0 10px 25px rgba(255,193,7,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--brand-blue); cursor: pointer; z-index: 10;}
        .punch-btn:active { transform: scale(0.95); }
        .punch-icon { font-size: 42px; margin-bottom: 5px; }
        .punch-text { font-size: 20px; font-weight: 900; letter-spacing: 2px;}

        .toggle-group { display: flex; background: white; border-radius: 30px; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: 0 auto; width: 100%; max-width: 250px;}
        .toggle-group label { flex:1; text-align:center; padding: 12px 0; border-radius: 25px; font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer; transition: 0.3s; }
        .toggle-group input { display: none; }
        .toggle-group input:checked + label { background: var(--brand-blue-light); color: var(--brand-blue); }
        
        .mgr-toggle { max-width: 100%; margin-bottom: 20px; border-radius: 12px; }
        .mgr-toggle label { border-radius: 8px; padding: 10px 0; font-size: 13px;}
        .gps-status { margin-top: 15px; font-size: 15px; font-weight: bold; color: #0f9d58; text-align: center; background: white; padding: 12px; border-radius: 12px; border: 1px solid #e6f4ea;}

        .app-form { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; width: 100%;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; color: var(--brand-blue); margin-bottom: 8px;}
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; background-color: var(--bg); outline: none; }
        .btn-action { width: 100%; padding: 14px; background: var(--brand-blue); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        
        .shift-card { background: white; border-left: 5px solid var(--brand-blue); padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03);}
        .shift-date { font-size: 15px; font-weight: bold; color: var(--text-main); }
        .shift-time { font-size: 14px; font-weight: bold; background: var(--brand-yellow); color: var(--brand-blue); padding: 5px 12px; border-radius: 6px; }
        .shift-off { border-left-color: #5f6368; } .shift-off .shift-time { background: #f1f3f4; color: #5f6368; }

        .att-card { background: white; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--brand-blue); box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center;}
        .att-name { font-size: 15px; font-weight: bold; color: var(--brand-blue); }
        .att-time { font-size: 13px; color: var(--text-sub); margin-top: 3px; }
        .att-badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-in { background: #e6f4ea; color: #137333; } .badge-out { background: #fce8e6; color: #c5221f; }

        .emp-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #eee; border-left: 4px solid var(--brand-yellow);}
        .emp-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed #ddd; padding-bottom: 8px;}
        .emp-name { font-size: 16px; font-weight: bold; color: var(--brand-blue); }
        .emp-role { font-size: 12px; background: var(--brand-blue-light); padding: 2px 8px; border-radius: 10px; color: var(--brand-blue); font-weight: bold;}

        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; display: flex; justify-content: space-around; padding: 10px 0 20px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.08); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 50;}
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9aa0a6; font-size: 11px; font-weight: 700; cursor: pointer; flex: 1;}
        .nav-icon { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--brand-blue); }
        .nav-item.active .nav-icon { transform: translateY(-3px); }

        #loadingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--brand-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:var(--brand-blue);">處理中...</div></div>
    <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">

    <div id="loginScreen">
        <div class="logo-area">
            <h1>呷呼霸</h1>
            <p>門市考勤管理系統</p>
        </div>
        <input type="text" id="loginName" class="login-input" placeholder="請輸入姓名">
        <input type="password" id="loginPwd" class="login-input" placeholder="請輸入密碼">
        <button class="btn-login" onclick="doLogin()">安全登入</button>
    </div>

    <div id="mainScreen">
        <div class="header-bg">
            <div class="app-title">呷呼霸 JIA HU BA</div>
            <div class="profile-row">
                <div class="profile-info">
                    <h2><span id="dispName">員工</span></h2>
                    <div><span class="store-badge" id="dispStore">載入中...</span></div>
                    <div class="profile-actions">
                        <button class="btn-tiny" onclick="changeMyPassword()">🔑 改密碼</button>
                        <button class="btn-tiny" onclick="doLogout()">🚪 登出</button>
                    </div>
                </div>
                <div class="avatar-wrapper" onclick="document.getElementById('avatarFileInput').click()">
                    <img id="dispAvatar" class="user-avatar" src="https://via.placeholder.com/150/003b6d/ffffff?text=呷" alt="頭像">
                    <div class="avatar-edit-badge">📷</div>
                </div>
            </div>
        </div>

        <div id="punchWarning">⚠️ 系統偵測到您今日可能漏打卡了！請盡速請店長或副店長協助補登。</div>

        <div id="viewPunch" class="view-section active">
            <div class="toggle-group">
                <input type="radio" name="punchType" id="typeIn" value="上班" checked>
                <label for="typeIn">上班打卡</label>
                <input type="radio" name="punchType" id="typeOut" value="下班">
                <label for="typeOut">下班打卡</label>
            </div>
            
            <div class="punch-btn-wrapper">
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="punch-btn" onclick="submitPunch()">
                    <div class="punch-icon">👆</div>
                    <div class="punch-text">打卡</div>
                </div>
            </div>
            <div class="gps-status" id="gpsStatus">📍 獲取定位中...</div>
        </div>

        <div id="viewSchedule" class="view-section">
            <div class="section-title">我的當月班表</div>
            <div style="text-align:center; margin-bottom:15px; font-weight:bold; color:var(--text-sub);">目前顯示：<span id="schedMonthDisp" style="color:var(--brand-blue);">載入中...</span></div>
            <div id="scheduleContent" style="display:flex; flex-direction:column;"></div>
        </div>

        <div id="viewFeedback" class="view-section">
            <div class="section-title">反應事項回報</div>
            <div class="app-form">
                <div class="form-group"><label>📝 狀況說明 (必填)</label><textarea id="fbText" class="form-control" rows="4"></textarea></div>
                <div class="form-group"><label>📸 現場照片 (選填)</label><input type="file" id="fbImage" class="form-control" accept="image/*" style="padding:8px; background:white;"></div>
                <button class="btn-action" onclick="submitFeedback()">🚀 送出回報</button>
            </div>
        </div>

        <div id="viewManager" class="view-section">
            <div class="section-title">主管管理專區</div>
            <div class="toggle-group mgr-toggle">
                <input type="radio" name="mgrType" id="mgrTabAtt" value="att" checked onchange="toggleMgrView()"><label for="mgrTabAtt">⏱️ 出勤</label>
                <input type="radio" name="mgrType" id="mgrTabDaily" value="daily" onchange="toggleMgrView()"><label for="mgrTabDaily">📅 人力</label>
                <input type="radio" name="mgrType" id="mgrTabSched" value="sched" onchange="toggleMgrView()"><label for="mgrTabSched">✏️ 排班</label>
                <input type="radio" name="mgrType" id="mgrTabDir" value="dir" onchange="toggleMgrView()"><label for="mgrTabDir">📖 通訊錄</label>
            </div>

            <div id="mgrSectionAtt">
                <div class="app-form" style="padding:12px; margin-bottom:12px; display:flex; gap:10px;">
                    <div style="flex:1;"><label style="font-weight:bold; color:var(--brand-blue); font-size:13px; margin-bottom:5px;">出勤日期</label><input type="date" id="mgrAttDate" class="form-control" onchange="loadAttendanceRecords()"></div>
                    <div><label style="font-weight:bold; color:var(--brand-blue); font-size:13px; margin-bottom:5px;">選項</label><button class="btn-action" style="margin:0; padding:12px; font-size:13px; background:#f4b400;" onclick="document.getElementById('mobileManualPanel').style.display='block'">補登</button></div>
                </div>

                <div id="mobileManualPanel" style="display:none; background:#fff3cd; border-left: 4px solid var(--brand-yellow); padding: 15px; border-radius: 12px; margin-bottom: 15px;">
                    <div style="font-weight:bold; color:#856404; margin-bottom:10px;">手動補登作業</div>
                    <div style="display:flex; flex-wrap:wrap; gap:8px;">
                        <select id="mobileManualEmp" class="form-control" style="width:100%; padding:8px;"></select>
                        <input type="date" id="mobileManualDate" class="form-control" style="width:48%; padding:8px;">
                        <input type="time" id="mobileManualTime" class="form-control" style="width:48%; padding:8px;">
                        <select id="mobileManualType" class="form-control" style="width:100%; padding:8px;"><option value="上班">上班</option><option value="下班">下班</option></select>
                        <button class="btn-action" style="width:48%; margin:0; padding:10px; font-size:14px; background:#0f9d58;" onclick="submitMobileManualPunch()">確認補登</button>
                        <button class="btn-action" style="width:48%; margin:0; padding:10px; font-size:14px; background:#d93025;" onclick="document.getElementById('mobileManualPanel').style.display='none'">取消</button>
                    </div>
                </div>
                <div id="mgrAttContent"></div>
            </div>

            <div id="mgrSectionDaily" style="display:none;">
                <div class="app-form" style="padding:12px; margin-bottom:12px;"><div class="form-group" style="margin-bottom:0;"><label>選擇檢視日期</label><input type="date" id="mgrDailyDate" class="form-control" onchange="renderDailySchedule()"></div></div>
                <div id="mgrDailyContent"></div>
            </div>

            <div id="mgrSectionSched" style="display:none;">
                <div class="app-form" style="padding:15px;">
                    <div class="form-group"><label>選擇修改月份</label><input type="month" id="mgrMonth" class="form-control" onchange="renderMgrSchedule()"></div>
                    <div class="form-group" style="margin-bottom:0;"><label>選擇對象</label><select id="mgrEmp" class="form-control" onchange="renderMgrSchedule()"></select></div>
                </div>
                <div id="mgrSchedContent" style="display:flex; flex-direction:column;"></div>
                <button class="btn-action" id="btnSaveMgr" style="display:none; margin-top:15px; background:#0f9d58;" onclick="saveMgrSchedule()">💾 儲存修改</button>
            </div>

            <div id="mgrSectionDir" style="display:none;"><div id="dirContent"></div></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchNav('viewPunch', this)"><div class="nav-icon">📍</div>打卡</div>
            <div class="nav-item" onclick="switchNav('viewSchedule', this); loadSchedule();"><div class="nav-icon">📅</div>班表</div>
            <div class="nav-item" onclick="switchNav('viewFeedback', this)"><div class="nav-icon">🗣️</div>反映</div>
            <div class="nav-item" id="navManager" style="display:none;" onclick="switchNav('viewManager', this); loadManagerData();"><div class="nav-icon">🛡️</div>管理區</div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMqYMpwUCNOwrsNGcYDdCAO723_Qgu26syp0CZJXLHIgp1nul2dzFW0XinwKZ-1_u5/exec";
    let userProfile = {}; let userLat = null, userLon = null; let isWithinRange = false; const ALLOWED_DIST = 300; let appGlobalData = null; 
    let STORE_LOCATIONS = {}; 

    window.onload = () => { const saved = localStorage.getItem('jiaHubaUser'); if (saved) { userProfile = JSON.parse(saved); showMainScreen(); loadDataForGPS(); } };

    function showLoading(text) { document.getElementById('loadingText').innerText = text; document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

    async function fetchApi(payload) { const res = await fetch(API_URL + "?t=" + new Date().getTime(), { method: 'POST', body: JSON.stringify(payload) }); return await res.json(); }

    async function doLogin() {
        const n = document.getElementById('loginName').value.trim(); const p = document.getElementById('loginPwd').value.trim();
        if(!n || !p) return;
        showLoading("驗證中...");
        try {
            const res = await fetchApi({ action: "login", name: n, pwd: p });
            if (res.status === "success") {
                if (res.name === '陳柏叡' || res.name === '鄭煒霖') res.role = '老闆';
                userProfile = res; localStorage.setItem('jiaHubaUser', JSON.stringify(userProfile)); showMainScreen(); loadDataForGPS();
            } else { hideLoading(); Swal.fire('登入失敗', res.msg, 'error'); }
        } catch (e) { hideLoading(); Swal.fire('登入異常', '系統無回應，請確認網路連線！', 'error'); }
    }

    function doLogout() { localStorage.removeItem('jiaHubaUser'); location.reload(); }

    function showMainScreen() {
        document.getElementById('loginScreen').style.display = 'none'; document.getElementById('mainScreen').style.display = 'flex';
        document.getElementById('dispName').innerText = userProfile.name; document.getElementById('dispStore').innerText = userProfile.store;
        if (userProfile.avatar) document.getElementById('dispAvatar').src = userProfile.avatar;
        if (userProfile.role === '店長' || userProfile.role === '副店長' || userProfile.role === '老闆') document.getElementById('navManager').style.display = 'flex';
    }

    // === 【核心防呆修復區】將所有的 catch 改寫 ===
    async function loadDataForGPS() {
        try {
            const res = await fetchApi({action: 'getData', name: userProfile.name, role: userProfile.role, store: userProfile.store});
            hideLoading();
            if(res.status === 'success') {
                appGlobalData = res.data;
                STORE_LOCATIONS = {};
                res.data.stores.forEach(s => {
                    let sName = typeof s === 'string' ? s : s.name;
                    let sLat = typeof s === 'string' ? '' : s.lat;
                    let sLon = typeof s === 'string' ? '' : s.lon;
                    if (sLat && sLon) STORE_LOCATIONS[sName] = { lat: parseFloat(sLat), lon: parseFloat(sLon) };
                });
                initGPS(); checkMyDailyPunch(); 
            } else {
                Swal.fire('讀取失敗', res.msg, 'error');
            }
        } catch(e) {
            hideLoading();
            Swal.fire('連線異常', '請確認您的 Google Apps Script 是否已更新並發布為最新版本！\n錯誤詳情：' + e.message, 'error');
        }
    }

    async function checkMyDailyPunch() {
        let now = new Date();
        let todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        try {
            if(!appGlobalData) return;
            let mySched = appGlobalData.schedule.find(s => String(s[0]).includes(todayStr.substring(0,7)) && s[2] === userProfile.name);
            let val = mySched ? mySched[2 + now.getDate()] : ""; let isOff = (!val || val === "休" || val === "排休");
            if (!isOff) {
                const pRes = await fetchApi({ action: "checkMyPunches", name: userProfile.name, date: todayStr });
                if(pRes.status === "success") {
                    let punches = pRes.punches; 
                    if (punches.length === 0 || punches.length === 1) document.getElementById('punchWarning').style.display = 'block';
                }
            }
        } catch(e) {}
    }

    function switchNav(viewId, element) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(viewId).classList.add('active'); element.classList.add('active');
    }

    async function uploadAvatar(input) {
        if (!input.files || !input.files[0]) return; const file = input.files[0]; showLoading("更新中...");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const img = new Image(); img.src = e.target.result;
            img.onload = async () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const scale = 200 / img.width;
                canvas.width = 200; canvas.height = img.height * scale; ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const base64Data = canvas.toDataURL('image/jpeg', 0.8);
                try {

    function getDistance(lat1, lon1, lat2, lon2) { const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180; const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180; const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2); return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }

            hideLoading(); if (res.status === "success") { Swal.fire('成功', res.msg, 'success'); document.getElementById('fbText').value = ""; document.getElementById('fbImage').value = ""; } else { Swal.fire('失敗', res.msg, 'error'); }
        } catch(e) { hideLoading(); Swal.fire('錯誤', e.message, 'error'); }
    }
</script>
