<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呷呼霸 - 營運管理中心 V8 (動態職稱版)</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --brand-blue: #003b6d; 
            --brand-blue-soft: #e8f0fe; 
            --brand-yellow: #ffc107;
            --bg: #f4f7f6; 
            --text-main: #202124; 
            --text-sub: #5f6368;
            --border: #dadce0;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin:0; padding:20px; color: var(--text-main); }
        .container { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .nav-title { font-size: 26px; font-weight: 900; color: var(--brand-blue); display: flex; align-items: center; gap: 10px; letter-spacing: 1px;}
        .nav-title span { color: var(--brand-blue); background: var(--brand-yellow); padding: 4px 10px; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.2s;}
        .nav-title span:hover { filter: brightness(0.95); }
        .user-badge { background: var(--brand-blue-soft); color: var(--brand-blue); padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        .nav-tabs { display: flex; gap: 12px; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 0; }
        .nav-tabs button { padding: 12px 24px; border: none; background: transparent; cursor: pointer; font-weight: bold; color: var(--text-sub); transition: 0.2s; font-size: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 4px solid transparent; margin-bottom: -2px;}
        .nav-tabs button:hover { color: var(--brand-blue); }
        .nav-tabs button.active { color: var(--brand-blue); border-bottom: 4px solid var(--brand-yellow); }
        
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        h3 { color: var(--brand-blue); border-left: 5px solid var(--brand-yellow); padding-left: 15px; margin-top: 0; font-size: 20px;}
        
        .table-responsive { width: 100%; max-height: 70vh; overflow: auto; background: white; border-radius: 10px; border: 1px solid var(--border); box-shadow: inset 0 0 5px rgba(0,0,0,0.02); }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1200px; }
        th, td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 6px; text-align: center; vertical-align: middle; }
        
        th { background: var(--brand-blue-soft); color: var(--brand-blue); font-size: 14px; font-weight: 900; position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 2px rgba(0,0,0,0.1); padding: 10px;}
        
        .col-role { position: sticky; left: 0; background: #fffcf0; z-index: 11; width: 85px; font-weight: bold; font-size: 13px; color: #555; box-shadow: 1px 0 2px rgba(0,0,0,0.05);}
        .col-name { position: sticky; left: 85px; background: white; z-index: 11; width: 80px; font-weight: bold; font-size: 15px; color: var(--brand-blue); box-shadow: 2px 0 5px rgba(0,0,0,0.05);}
        th.col-role, th.col-name { z-index: 21; background: var(--brand-blue-soft); color: var(--brand-blue); }
        
        tr:hover td { background-color: #fdfdfd; }
        tr:hover td.col-role { background-color: #fcf8e3; }
        tr:hover td.col-name { background-color: #fafafa; }

        .sys-task-1 td { background: var(--brand-yellow) !important; color: var(--brand-blue) !important; border-bottom: 1px solid #d39e00;}
        .sys-task-1 input { background: #fff3cd !important; color: #856404 !important; font-weight: 900;}
        .sys-task-1 input:focus { box-shadow: 0 0 0 2px #ffeeba !important; }
        
        .sys-task-2 td { background: #d1ecf1 !important; color: #0c5460 !important; border-bottom: 1px solid #bee5eb;}
        .sys-task-2 input { background: #e8f4f8 !important; color: #0c5460 !important; font-weight: 900;}
        .sys-task-2 input:focus { box-shadow: 0 0 0 2px #c3e6cb !important; }

        .shift-input { width: 100%; min-width: 100px; height: 38px; font-size: 14px; font-weight: bold; text-align: center; border: 1px solid transparent; border-radius: 4px; outline: none; transition: 0.2s; box-sizing: border-box; background: transparent;}
        .shift-input:focus { border-color: var(--brand-blue); background: #fff; box-shadow: 0 0 0 2px var(--brand-blue-soft); }
        .shift-input.is-off { color: #d93025; } 
        .shift-input.is-work { color: #202124; }
        
        .custom-role-input { width: 100%; height: 34px; font-size: 13px; font-weight: bold; text-align: center; border: 1px dashed #ccc; border-radius: 4px; outline: none; background: transparent; color: #d93025;}
        .custom-role-input:focus { border: 1px solid var(--brand-blue); background: #fff;}

        .summary-row td { background: var(--brand-blue-soft); color: var(--brand-blue); font-weight: 900; font-size: 16px; border-top: 2px solid var(--brand-blue); padding: 12px 6px;}
        .summary-row.alt td { background: #fff8e1; color: #b07d00; border-top: 1px solid #ffe082;}

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 15px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary { background: var(--brand-blue); color: white; }
        .btn-success { background: #0f9d58; color: white; }
        .btn-warning { background: var(--brand-yellow); color: var(--brand-blue); }
        .btn-info { background: #17a2b8; color: #fff; }
        
        input[type="text"], input[type="password"], input[type="date"], input[type="month"], select, input[type="number"] { 
            padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px; width: 100%; box-sizing: border-box; transition: 0.2s;
        }
        input:focus, select:focus { border-color: var(--brand-blue); background: #fff; box-shadow: 0 0 0 3px var(--brand-blue-soft);}

        .hr-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; background: #fcfcfc; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border); }
        .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--brand-blue); }
    </style>
</head>
<body>

    <div id="loginScreen" class="container" style="max-width: 420px; margin-top: 10vh; text-align: center; padding: 50px 30px;">
        <h2 style="color: var(--brand-blue); font-size: 38px; font-weight: 900; margin-bottom: 5px; letter-spacing: 2px;">呷呼霸</h2>
        <p style="color: var(--brand-blue); background: var(--brand-yellow); padding: 4px 12px; border-radius: 8px; display: inline-block; font-weight: bold; margin-bottom: 40px; font-size: 15px;">門市管理後台系統</p>
        <input type="text" id="loginName" placeholder="請輸入您的姓名" style="margin-bottom: 20px;"><br>
        <input type="password" id="loginPwd" placeholder="請輸入登入密碼" style="margin-bottom: 30px;"><br>
        <button class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 18px;" onclick="doLogin()">安全登入</button>
    </div>

    <div id="mainScreen" class="container" style="display: none;">
        <div class="top-nav">
            <div class="nav-title">呷呼霸 <span onclick="unlockMasterKey()" title="點擊解鎖最高權限">營運管理中心</span></div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="user-badge"><span id="userRole"></span> : <span id="userName"></span> (<span id="userStore"></span>)</div>
                <button class="btn" style="background: #f1f3f4; color: var(--text-main); border: 1px solid var(--border);" onclick="location.reload()">登出系統</button>
            </div>
        </div>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('viewSchedule', this)">📅 專業週班表</button>
            <button class="tab-btn" onclick="switchTab('viewEmployees', this)">👥 人事維護與計薪</button>
            <button class="tab-btn" onclick="switchTab('viewPayroll', this)">💰 薪資單自動結算</button>
        </div>

        <div id="viewSchedule" class="view-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                <h3>門市排班管理 <span style="font-size:14px; color:#999; font-weight:normal; margin-left:10px;">(自動加總版)</span></h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-warning" onclick="copyLastWeek()"><span style="font-size: 16px;">🔄</span> 複製上週</button>
                    <button class="btn btn-info" onclick="exportCSV()"><span style="font-size: 16px;">📥</span> 匯出本週 Excel</button>
                    <button class="btn btn-success" onclick="saveWeeklySchedule()"><span style="font-size: 16px;">💾</span> 儲存排班</button>
                </div>
            </div>
            
            <div style="background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); display: flex; gap: 30px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: bold; color: var(--brand-blue); font-size: 15px;">選擇日期 (跳至該週)</span>
                    <input type="date" id="schedWeekDate" onchange="renderWeeklySchedule()" style="width: 160px; background: #f8f9fa;">
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: bold; color: var(--brand-blue); font-size: 15px;">過濾檢視門市</span>
                    <select id="schedStore" onchange="renderWeeklySchedule()" style="width: 220px; background: #f8f9fa;">
                        <option value="呷呼霸土城店">呷呼霸土城店</option>
                        <option value="呷呼霸南崁店">呷呼霸南崁店</option>
                        <option value="呷呼霸長榮店">呷呼霸長榮店</option>
                        <option value="呷呼霸蘆洲中山店">呷呼霸蘆洲中山店</option>
                        <option value="呷呼霸林口店">呷呼霸林口店</option>
                        <option value="呷呼霸汐止店">呷呼霸汐止店</option>
                        <option value="呷呼霸淡大店">呷呼霸淡大店</option>
                        <option value="呷呼霸淡水店">呷呼霸淡水店</option>
                        <option value="總公司">總公司</option>
                    </select>
                </div>
            </div>
            
            <div class="table-responsive">
                <table id="schedTable">
                    <thead id="schedHead"></thead>
                    <tbody id="schedBody"></tbody>
                    <tfoot id="schedFoot"></tfoot>
                </table>
            </div>
        </div>

        <div id="viewEmployees" class="view-section">
            <h3>員工基本檔與計薪設定</h3>
            <div style="background: var(--brand-blue-soft); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #cce5ff; display: flex; gap: 20px; align-items: flex-end;">
                <div style="flex: 1;">
                    <label style="font-size: 15px; font-weight: bold; color: var(--brand-blue); display: block; margin-bottom: 8px;">編輯現有員工資料</label>
                    <select id="filterEmp" onchange="loadEmpDetails()" style="background: white;"><option value="">請點此選擇要編輯的員工...</option></select>
                </div>
                <div><button class="btn btn-warning" onclick="clearForm()" style="color:var(--brand-blue);">➕ 建立新員工 / 清空表單</button></div>
            </div>

            <div class="hr-form-grid">
                <div class="form-group"><label>員工姓名</label><input type="text" id="empName"></div>
                <div class="form-group"><label>所屬門市</label>
                    <select id="empStore">
                        <option value="呷呼霸土城店">呷呼霸土城店</option>
                        <option value="呷呼霸南崁店">呷呼霸南崁店</option>
                        <option value="呷呼霸長榮店">呷呼霸長榮店</option>
                        <option value="呷呼霸蘆洲中山店">呷呼霸蘆洲中山店</option>
                        <option value="呷呼霸林口店">呷呼霸林口店</option>
                        <option value="呷呼霸汐止店">呷呼霸汐止店</option>
                        <option value="呷呼霸淡大店">呷呼霸淡大店</option>
                        <option value="總公司">總公司</option>
                    </select>
                </div>
                <div class="form-group"><label>權限角色</label>
                    <select id="empRole">
                        <option value="正職">正職</option>
                        <option value="PT">PT</option>
                        <option value="副店長">副店長</option>
                        <option value="店長">店長</option>
                        <option value="老闆">老闆</option>
                    </select>
                </div>
                <div class="form-group"><label>APP 登入密碼</label><input type="text" id="empPwd" placeholder="預設建議: 1234"></div>
                <div class="form-group"><label>在職狀態</label><select id="empStatus"><option value="在職">🟢 在職中</option><option value="離職">🔴 已離職</option></select></div>
                <div class="form-group"><label>計薪類別</label><select id="empPayType"><option value="月薪">月薪</option><option value="時薪">時薪</option></select></div>
                <div class="form-group"><label>假日計薪身分</label><select id="empDutyType"><option value="一般員工 (有加班費)">一般員工 (有加班費)</option><option value="責任制幹部 (無加班費)">責任制幹部 (無加班費)</option></select></div>
                <div class="form-group"><label>基本薪資/時薪</label><input type="number" id="empSalary" placeholder="輸入數字"></div>
                <div class="form-group"><label>到職日期</label><input type="date" id="empObDate"></div>
                <div class="form-group"><label>剩餘特休天數</label><input type="number" step="0.5" id="empAnnualLeave"></div>
                <div class="form-group"><label>變動獎金基數</label><input type="number" id="empBonus" value="0"></div>
                <div class="form-group"><label>勞保自付額</label><input type="number" id="empLaborIns" value="0"></div>
                <div class="form-group"><label>健保自付額</label><input type="number" id="empHealthIns" value="0"></div>
                <div class="form-group"><label>依附眷屬人數</label><input type="number" id="empDependents" value="0"></div>
                <div class="form-group"><label>聯絡電話</label><input type="text" id="empPhone"></div>
                <div class="form-group"><label>通訊住址</label><input type="text" id="empAddress"></div>
                <div class="form-group" style="grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 10px;">
                    <button class="btn btn-primary" style="padding: 14px 30px; font-size: 16px;" onclick="saveEmployee()">💾 儲存員工資料</button>
                </div>
            </div>

            <div class="table-responsive" style="max-height: 50vh;">
                <table id="empTable" style="min-width: 1000px;">
                    <thead><tr><th>姓名</th><th>門市</th><th>角色</th><th>密碼</th><th>狀態</th><th>計薪</th><th>底薪/時薪</th><th>操作選項</th></tr></thead>
                    <tbody id="empBody"></tbody>
                </table>
            </div>
        </div>

        <div id="viewPayroll" class="view-section">
            <h3>薪資單自動結算與列印</h3>
            <div style="background: #fff; padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="font-weight: bold; color: var(--brand-blue); font-size: 16px;">選擇結算月份</span>
                    <input type="month" id="payrollMonth" style="width: 180px; background: #f8f9fa;">
                </div>
                <button class="btn btn-success" style="padding: 14px 28px; font-size: 16px;" onclick="generatePayslips()">🖨️ 產生四合一薪資單</button>
            </div>
            <div id="printArea" style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); display: none;"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxMqYMpwUCNOwrsNGcYDdCAO723_Qgu26syp0CZJXLHIgp1nul2dzFW0XinwKZ-1_u5/exec";
        let currentUser = {};
        let globalData = { schedule: [], employees: [] };

        async function fetchApi(payload) {
            const res = await fetch(API_URL + "?t=" + new Date().getTime(), { method: 'POST', body: JSON.stringify(payload) });
            return await res.json();
        }

        async function doLogin() {
            const n = document.getElementById('loginName').value.trim();
            const p = document.getElementById('loginPwd').value.trim();
            if(!n || !p) return;
            Swal.fire({title: '驗證中...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() }});
            try {
                const res = await fetchApi({action: 'login', name: n, pwd: p});
                if(res.status === 'success') {
                    if(res.role === '員工') return Swal.fire('權限不足', '此為管理後台', 'error');
                    currentUser = res;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainScreen').style.display = 'block';
                    document.getElementById('userName').innerText = res.name;
                    document.getElementById('userRole').innerText = res.role;
                    document.getElementById('userStore').innerText = res.store;
                    
                    let now = new Date();
                    let dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
                    let mStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                    
                    document.getElementById('schedWeekDate').value = dateStr;
                    document.getElementById('payrollMonth').value = mStr;
                    
                    if(res.role === '店長' || res.role === '副店長') {
                        document.getElementById('schedStore').value = res.store;
                        document.getElementById('schedStore').disabled = true; 
                        document.getElementById('empStore').value = res.store;
                        document.getElementById('empStore').disabled = true;
                    }
                    Swal.close(); loadData();
                } else { Swal.fire('失敗', res.msg, 'error'); }
            } catch(e) { Swal.fire('錯誤', e.message, 'error'); }
        }

        async function unlockMasterKey() {
            if(currentUser.role === '老闆') return Swal.fire('提示', '您已經擁有最高權限！', 'info');
            const { value: key } = await Swal.fire({
                title: '🔑 系統隱藏金鑰', input: 'password', showCancelButton: true,
                confirmButtonText: '解鎖', confirmButtonColor: '#003b6d', cancelButtonText: '取消'
            });
            if (key === 'boss888') {
                currentUser.role = '老闆'; 
                document.getElementById('schedStore').disabled = false;
                document.getElementById('empStore').disabled = false;
                document.getElementById('userRole').innerText = '最高管理員 (解鎖)';
                document.getElementById('userRole').style.color = '#d93025';
                Swal.fire('解鎖成功！', '已開啟跨門市權限', 'success');
                loadData(); 
            } else if (key) { Swal.fire('錯誤', '金鑰無效', 'error'); }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if(tabId === 'viewEmployees') updateEmpDropdown();
        }

        async function loadData() {
            Swal.fire({title: '資料同步中...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() }});
            try {
                const res = await fetchApi({action: 'getData', name: currentUser.name, role: currentUser.role, store: document.getElementById('schedStore').value});
                if(res.status === 'success') {
                    globalData = res.data;
                    renderWeeklySchedule(); renderEmployees(); updateEmpDropdown(); Swal.close();
                }
            } catch(e) {}
        }

        // ================= 班表與自動計算邏輯 =================
        function handleShiftChange(input) {
            let val = input.value.trim();
            if(!input.getAttribute('data-emp').includes('[系統]')) {
                if(val === '休' || val === '排休') {
                    input.className = 'shift-input is-off';
                } else {
                    input.className = 'shift-input is-work';
                }
            }
            calculateTotals();
        }

        function getSysTask(monthStr, dd, sysName, store) {
            let mySched = globalData.schedule.find(s => {
                let rM = String(s[0]);
                if(rM.includes('T')) rM = `${new Date(s[0]).getFullYear()}-${String(new Date(s[0]).getMonth()+1).padStart(2,'0')}`;
                else if(rM.includes('/')) rM = rM.split('/')[0] + '-' + rM.split('/')[1].padStart(2,'0');
                return rM === monthStr && s[2] === sysName && s[1] === store;
            });
            return mySched ? mySched[2+dd] : "";
        }

        function renderWeeklySchedule() {
            let selectedDateStr = document.getElementById('schedWeekDate').value;
            let targetStore = document.getElementById('schedStore').value;
            if(!selectedDateStr) return;
            
            let selectedDate = new Date(selectedDateStr);
            let day = selectedDate.getDay() || 7; 
            if(day !== 1) selectedDate.setHours(-24 * (day - 1)); 
            
            let weekDates = [];
            let theadHtml = '<tr><th class="col-role">職稱方向</th><th class="col-name">姓名</th>';
            for(let i=0; i<7; i++) {
                let d = new Date(selectedDate);
                d.setDate(selectedDate.getDate() + i);
                weekDates.push(d);
                let dateStr = `${d.getMonth()+1}/${d.getDate()}`;
                let wStr = ["日","一","二","三","四","五","六"][d.getDay()];
                theadHtml += `<th>${dateStr}<br><span style="font-size:12px; font-weight:normal;">星期${wStr}</span></th>`;
            }
            theadHtml += '</tr>';
            document.getElementById('schedHead').innerHTML = theadHtml;

            let bodyHtml = '';

            let taskRow1 = `<tr class="sys-task-1">
                <td class="col-role" style="background:var(--brand-yellow); color:var(--brand-blue);">職稱任務</td>
                <td class="col-name" style="background:var(--brand-yellow); color:var(--brand-blue);"></td>`;
            let taskRow2 = `<tr class="sys-task-2">
                <td class="col-role" style="background:#d1ecf1; color:#0c5460; font-size:12px;">開班備註</td>
                <td class="col-name" style="background:#d1ecf1; color:#0c5460;"></td>`;

            weekDates.forEach((date, i) => {
                let monthStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
                let dd = date.getDate();
                let t1 = getSysTask(monthStr, dd, '[系統]每日任務', targetStore);
                let t2 = getSysTask(monthStr, dd, '[系統]開班備註', targetStore);

                taskRow1 += `<td><input type="text" class="shift-input" value="${t1}" data-emp="[系統]每日任務" data-month="${monthStr}" data-day="${dd}"></td>`;
                taskRow2 += `<td><input type="text" class="shift-input" value="${t2}" data-emp="[系統]開班備註" data-month="${monthStr}" data-day="${dd}"></td>`;
            });
            taskRow1 += `</tr>`; taskRow2 += `</tr>`;
            bodyHtml += taskRow1 + taskRow2;

            let emps = globalData.employees.filter(e => e[1] === targetStore && e[4] !== "離職");
            const roleOrder = {"老闆":1, "店長":2, "副店長":3, "正職":4, "PT":5};
            emps.sort((a,b) => (roleOrder[a[2]]||99) - (roleOrder[b[2]]||99));

            emps.forEach(emp => {
                let name = emp[0];
                let hrRole = emp[2]; 
                // 判斷是否為管理階層，若是則顯示職稱，若否則顯示隱形輸入框
                let isManager = (hrRole === '店長' || hrRole === '副店長' || hrRole === '老闆');
                let displayRoleUI = isManager ? hrRole : `<input type="text" class="custom-role-input" placeholder="填寫方向" oninput="calculateTotals()">`;

                bodyHtml += `<tr><td class="col-role">${displayRoleUI}</td><td class="col-name">${name}</td>`;
                
                weekDates.forEach((date, i) => {
                    let monthStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
                    let dd = date.getDate();
                    
                    let mySched = globalData.schedule.find(s => {
                        let rM = String(s[0]);
                        if(rM.includes('T')) rM = `${new Date(s[0]).getFullYear()}-${String(new Date(s[0]).getMonth()+1).padStart(2,'0')}`;
                        else if(rM.includes('/')) rM = rM.split('/')[0] + '-' + rM.split('/')[1].padStart(2,'0');
                        return rM === monthStr && s[2] === name && s[1] === targetStore;
                    });
                    
                    let val = mySched ? mySched[2+dd] : "";
                    if(val && String(val).includes('T')) { val = new Date(val); val = val.getFullYear()<2000 ? String(val.getHours()).padStart(2,'0')+':'+String(val.getMinutes()).padStart(2,'0') : (val.getMonth()+1)+'-'+val.getDate(); }
                    
                    let isOff = (val === '休' || val === '排休');
                    let textClass = isOff ? 'shift-input is-off' : 'shift-input is-work';

                    bodyHtml += `<td>
                        <input type="text" class="${textClass}" value="${isOff ? '休' : val}" 
                            data-emp="${name}" data-month="${monthStr}" data-day="${dd}" 
                            oninput="handleShiftChange(this)" ondblclick="this.value='休'; handleShiftChange(this)">
                    </td>`;
                });
                bodyHtml += '</tr>';
            });
            document.getElementById('schedBody').innerHTML = bodyHtml;
            setTimeout(calculateTotals, 100);
        }

        function calculateTotals() {
            let earlyCounts = [0,0,0,0,0,0,0];
            let lateCounts = [0,0,0,0,0,0,0];
            let closeCounts = [0,0,0,0,0,0,0];
            
            document.querySelectorAll('#schedBody tr').forEach(tr => {
                let roleCell = tr.querySelector('.col-role');
                if(!roleCell) return;
                if(roleCell.innerText.includes('職稱') || roleCell.innerText.includes('備註')) return; 
                
                // 抓取機動填寫的職稱方向
                let roleInput = roleCell.querySelector('.custom-role-input');
                let roleText = roleInput ? roleInput.value.trim() : roleCell.innerText.trim();
                
                let inputs = tr.querySelectorAll('.shift-input');
                inputs.forEach((inp, idx) => {
                    let val = inp.value.trim();
                    if(val && val !== '休' && val !== '排休') {
                        if(roleText.includes('打烊')) { 
                            closeCounts[idx]++; 
                        } else {
                            if(val.includes('10') || val.includes('11') || val.includes('12') || val.includes('13') || val.includes('09')) earlyCounts[idx]++;
                            if(val.includes('16') || val.includes('17') || val.includes('18') || val.includes('19')) lateCounts[idx]++;
                            if(val.includes('01') || val.includes('23') || val.includes('24') || val.includes('22:30') || val.includes('22-01')) closeCounts[idx]++;
                        }
                    }
                });
            });

            let footHtml = `
                <tr class="summary-row">
                    <td colspan="2" style="text-align:right; padding-right:15px; background:var(--brand-blue-soft);">早班 / 開班人數</td>
                    ${earlyCounts.map(c => `<td>${c}</td>`).join('')}
                </tr>
                <tr class="summary-row alt">
                    <td colspan="2" style="text-align:right; padding-right:15px; background:#fff8e1;">晚班 / 值班人數</td>
                    ${lateCounts.map(c => `<td>${c}</td>`).join('')}
                </tr>
                <tr class="summary-row">
                    <td colspan="2" style="text-align:right; padding-right:15px; background:var(--brand-blue-soft);">打烊人數</td>
                    ${closeCounts.map(c => `<td>${c}</td>`).join('')}
                </tr>
            `;
            document.getElementById('schedFoot').innerHTML = footHtml;
        }

        async function saveWeeklySchedule() {
            let inputs = document.querySelectorAll('.shift-input');
            let monthsToSave = new Set();
            let store = document.getElementById('schedStore').value;
            
            inputs.forEach(inp => {
                let empName = inp.getAttribute('data-emp');
                let monthStr = inp.getAttribute('data-month');
                let day = parseInt(inp.getAttribute('data-day'));
                let val = inp.value.trim();
                
                monthsToSave.add(monthStr);
                
                let sRow = globalData.schedule.find(s => {
                    let rM = String(s[0]);
                    if(rM.includes('T')) rM = `${new Date(s[0]).getFullYear()}-${String(new Date(s[0]).getMonth()+1).padStart(2,'0')}`;
                    else if(rM.includes('/')) rM = rM.split('/')[0] + '-' + rM.split('/')[1].padStart(2,'0');
                    return rM === monthStr && s[2] === empName && s[1] === store;
                });
                
                if(!sRow) {
                    sRow = [monthStr, store, empName, ...Array(31).fill("")];
                    globalData.schedule.push(sRow);
                }
                sRow[2 + day] = val;
            });

            if(monthsToSave.size === 0) return;
            Swal.fire({title: '儲存與驗證中...', text: '若遇跨月會分批上傳...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() }});
            
            try {
                for (let m of monthsToSave) {
                    let payloadData = [];
                    let emps = globalData.employees.filter(e => e[1] === store && e[4] !== "離職");
                    let namesToProcess = ['[系統]每日任務', '[系統]開班備註', ...emps.map(e => e[0])];
                    
                    namesToProcess.forEach(empName => {
                        let sRow = globalData.schedule.find(s => {
                            let rM = String(s[0]);
                            if(rM.includes('T')) rM = `${new Date(s[0]).getFullYear()}-${String(new Date(s[0]).getMonth()+1).padStart(2,'0')}`;
                            else if(rM.includes('/')) rM = rM.split('/')[0] + '-' + rM.split('/')[1].padStart(2,'0');
                            return rM === m && s[2] === empName && s[1] === store;
                        });
                        let shifts = sRow ? sRow.slice(3, 34) : Array(31).fill("");
                        shifts = shifts.map(x => x == null ? "" : String(x));
                        payloadData.push({name: empName, shifts: shifts});
                    });
                    
                    let res = await fetchApi({ action: 'saveSchedule', month: m, store: store, scheduleData: payloadData });
                    if(res.status !== 'success') throw new Error(res.msg);
                }
                Swal.fire('成功', '排班表儲存成功！', 'success');
                loadData(); 
            } catch(e) { Swal.fire('錯誤', e.message, 'error'); }
        }

        function copyLastWeek() {
            Swal.fire({
                title: '確認套用？', text: `確定要將「上週」的班表(包含任務)完全複製到「本週」嗎？`, icon: 'question',
                showCancelButton: true, confirmButtonColor: '#ffc107', confirmButtonText: '確定'
            }).then((result) => {
                if(result.isConfirmed) {
                    let inputs = document.querySelectorAll('.shift-input');
                    inputs.forEach(inp => {
                        let empName = inp.getAttribute('data-emp');
                        let currentMonth = inp.getAttribute('data-month');
                        let currentDay = parseInt(inp.getAttribute('data-day'));
                        
                        let [yy, mm] = currentMonth.split('-');
                        let d = new Date(yy, parseInt(mm)-1, currentDay);
                        d.setDate(d.getDate() - 7);
                        let lastWkMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                        let lastWkDay = d.getDate();

                        let lastWkRow = globalData.schedule.find(s => {
                            let rM = String(s[0]);
                            if(rM.includes('T')) rM = `${new Date(s[0]).getFullYear()}-${String(new Date(s[0]).getMonth()+1).padStart(2,'0')}`;
                            else if(rM.includes('/')) rM = rM.split('/')[0] + '-' + rM.split('/')[1].padStart(2,'0');
                            return rM === lastWkMonth && s[2] === empName && s[1] === document.getElementById('schedStore').value;
                        });

                        if (lastWkRow && (2 + lastWkDay) < lastWkRow.length) {
                            let val = lastWkRow[2 + lastWkDay];
                            if(String(val).includes('T')) { val = new Date(val); val = val.getFullYear()<2000 ? String(val.getHours()).padStart(2,'0')+':'+String(val.getMinutes()).padStart(2,'0') : (val.getMonth()+1)+'-'+val.getDate(); }
                            inp.value = val ? val : "休";
                        } else { inp.value = "休"; }
                        
                        handleShiftChange(inp);
                    });
                    Swal.fire('已套用', '請確認無誤後點擊「儲存排班」', 'success');
                }
            });
        }

        function exportCSV() {
            const dateStr = document.getElementById('schedWeekDate').value;
            const store = document.getElementById('schedStore').value;
            let csvContent = "\uFEFF"; 
            let rows = document.querySelectorAll('#schedTable tr');
            rows.forEach(row => {
                let rowData = [];
                row.querySelectorAll('th, td').forEach(col => {
                    let customRoleInput = col.querySelector('.custom-role-input');
                    let shiftInput = col.querySelector('.shift-input');
                    
                    if (customRoleInput) {
                        rowData.push(`"${customRoleInput.value || ''}"`);
                    } else if (shiftInput) {
                        rowData.push(`"${shiftInput.value || '休'}"`);
                    } else {
                        rowData.push(`"${col.innerText.replace(/\n/g, ' ')}"`);
                    }
                });
                csvContent += rowData.join(",") + "\n";
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            link.download = `${store}_週班表_${dateStr}.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        // ================= 人事維護與計薪 =================
        function updateEmpDropdown() {
            let sel = document.getElementById('filterEmp');
            sel.innerHTML = '<option value="">請選擇員工...</option>';
            let displayEmps = globalData.employees;
            if(currentUser.role === '店長' || currentUser.role === '副店長') displayEmps = displayEmps.filter(e => e[1] === currentUser.store);
            displayEmps.forEach(e => { sel.innerHTML += `<option value="${e[0]}">${e[0]} - ${e[1]}</option>`; });
        }

        function loadEmpDetails() {
            let name = document.getElementById('filterEmp').value;
            if(!name) return clearForm();
            let emp = globalData.employees.find(e => e[0] === name);
            if(emp) {
                document.getElementById('empName').value = emp[0]; document.getElementById('empStore').value = emp[1]; document.getElementById('empRole').value = emp[2];
                document.getElementById('empPwd').value = emp[3]; document.getElementById('empStatus').value = emp[4]; document.getElementById('empPayType').value = emp[6] || '月薪';
                document.getElementById('empSalary').value = emp[7] || 0; document.getElementById('empDutyType').value = emp[8] || '一般員工'; document.getElementById('empObDate').value = emp[9] ? String(emp[9]).split('T')[0] : '';
                document.getElementById('empAnnualLeave').value = emp[10] || 0; document.getElementById('empBonus').value = emp[11] || 0; document.getElementById('empLaborIns').value = emp[12] || 0;
                document.getElementById('empHealthIns').value = emp[13] || 0; document.getElementById('empDependents').value = emp[14] || 0; document.getElementById('empPhone').value = emp[15] || ''; document.getElementById('empAddress').value = emp[16] || '';
            }
        }

        function clearForm() {
            document.getElementById('filterEmp').value = ""; document.getElementById('empName').value = ""; document.getElementById('empPwd').value = "";
            document.getElementById('empSalary').value = ""; document.getElementById('empStatus').value = "在職"; document.getElementById('empPayType').value = "月薪";
            document.getElementById('empRole').value = "正職"; document.getElementById('empDutyType').value = "一般員工"; document.getElementById('empObDate').value = "";
            document.getElementById('empAnnualLeave').value = ""; ['empBonus', 'empLaborIns', 'empHealthIns', 'empDependents'].forEach(id => document.getElementById(id).value = "0");
            ['empPhone', 'empAddress'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('empStore').value = (currentUser.role === '店長' || currentUser.role === '副店長') ? currentUser.store : "呷呼霸土城店";
        }

        async function saveEmployee() {
            let payload = {
                action: "saveEmployee", name: document.getElementById('empName').value.trim(), store: document.getElementById('empStore').value, role: document.getElementById('empRole').value,
                pwd: document.getElementById('empPwd').value.trim(), status: document.getElementById('empStatus').value, payType: document.getElementById('empPayType').value, salary: document.getElementById('empSalary').value,
                dutyType: document.getElementById('empDutyType').value, obDate: document.getElementById('empObDate').value, annualLeave: document.getElementById('empAnnualLeave').value, bonus: document.getElementById('empBonus').value,
                laborIns: document.getElementById('empLaborIns').value, healthIns: document.getElementById('empHealthIns').value, dependents: document.getElementById('empDependents').value, phone: document.getElementById('empPhone').value, address: document.getElementById('empAddress').value
            };
            if(!payload.name) return Swal.fire('提示', '姓名必填寫！', 'warning');
            Swal.fire({title: '儲存中...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() }});
            try {
                const res = await fetchApi(payload);
                if(res.status === 'success') { Swal.fire('成功', '已儲存！', 'success'); loadData(); clearForm(); }
            } catch(e) {}
        }

        async function deleteEmployee(empName) {
            if(!confirm(`確定徹底刪除【${empName}】的資料嗎？`)) return;
            Swal.fire({title: '刪除中...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() }});
            try {
                const res = await fetchApi({ action: 'deleteEmployee', name: empName });
                if(res.status === 'success') { Swal.fire('已刪除', res.msg, 'success'); loadData(); clearForm(); }
            } catch(e) {}
        }

        function renderEmployees() {
            let html = '';
            let displayEmps = globalData.employees;
            if(currentUser.role === '店長' || currentUser.role === '副店長') displayEmps = displayEmps.filter(e => e[1] === currentUser.store);
            displayEmps.forEach(emp => {
                html += `<tr>
                    <td style="font-weight:bold; color:var(--brand-blue);">${emp[0]}</td><td>${emp[1]}</td><td>${emp[2]}</td><td style="color:#adb5bd;">***</td>
                    <td>${emp[4] === "離職" ? '<span style="color:#d93025; font-weight:bold;">已離職</span>' : '<span style="color:#0f9d58; font-weight:bold;">在職中</span>'}</td>
                    <td>${emp[6] || '月薪'}</td><td style="font-weight:bold;">${(currentUser.role === "店長" || currentUser.role === "副店長") ? "***" : `$${emp[7]||0}`}</td>
                    <td><button class="btn btn-primary" style="padding:6px 12px; font-size:13px;" onclick="quickEdit('${emp[0]}')">編輯</button>
                        <button class="btn btn-danger" style="padding:6px 12px; font-size:13px;" onclick="deleteEmployee('${emp[0]}')">刪除</button></td></tr>`;
            });
            document.getElementById('empBody').innerHTML = html;
        }

        function quickEdit(name) { document.getElementById('filterEmp').value = name; loadEmpDetails(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function generatePayslips() {
            const printArea = document.getElementById('printArea'); printArea.style.display = 'block';
            let html = ''; let count = 0; const targetMonth = document.getElementById('payrollMonth').value;
            let targetEmps = globalData.employees.filter(e => e[4] !== "離職");
            if(currentUser.role === "店長" || currentUser.role === "副店長") targetEmps = targetEmps.filter(e => e[1] === currentUser.store);

            targetEmps.forEach((emp) => {
                let name = emp[0]; let store = emp[1]; let payType = emp[6] || '月薪'; let base = Number(emp[7]) || 0; let hourlyDeduct = payType === '月薪' ? Math.round(base/30/8) : 0;
                html += `<div class="payslip">
                    <div style="display:flex; justify-content:space-between; border-bottom: 2px solid var(--brand-blue); padding-bottom:8px; margin-bottom:15px;">
                        <h3 style="margin:0; color:var(--brand-blue); font-size:18px; border:none; padding:0;">呷呼霸 員工薪資單</h3><span style="font-weight:bold; color:#555;">${targetMonth}</span>
                    </div>
                    <div style="font-size:14px; line-height:1.8;">
                        <span style="display:inline-block; width:48%;"><strong>門市：</strong> ${store}</span><span style="display:inline-block; width:48%;"><strong>計薪：</strong> ${payType}</span><br>
                        <span style="display:inline-block; width:48%;"><strong>姓名：</strong> <span style="font-size:16px; color:var(--brand-blue); font-weight:bold;">${name}</span></span><span style="display:inline-block; width:48%;"><strong>底薪/時薪：</strong> $${base}</span>
                    </div>
                    <hr style="border:0; border-top:1px dashed #ccc; margin:15px 0;">
                    <table style="width:100%; text-align:left; border:none; margin:0; min-width:auto;">
                        <tr><td style="border:none; padding:4px; text-align:left;">🔹 伙食津貼 / 獎金：</td><td style="border:none; text-align:right; color:#0f9d58; font-weight:bold;">+$0</td></tr>
                        <tr><td style="border:none; padding:4px; text-align:left;">🔸 加班費 (含颱風加給)：</td><td style="border:none; text-align:right; color:#0f9d58; font-weight:bold;">+$0</td></tr>
                        <tr><td style="border:none; padding:4px; text-align:left;">🔻 遲到扣款 (費率 $${hourlyDeduct}/hr)：</td><td style="border:none; text-align:right; color:#d93025; font-weight:bold;">-$0</td></tr>
                    </table>
                    <div style="background: var(--brand-blue-soft); padding:12px; border-radius:8px; margin-top:15px; text-align:right;">
                        <span style="font-size:13px; color:var(--brand-blue); margin-right:15px;">實發總計</span><span style="font-size:22px; font-weight:900; color:var(--brand-blue);"> $${base} </span>
                    </div></div>`;
                count++; if(count % 4 === 0) html += '<div class="page-break"></div>';
            });
            printArea.innerHTML = html; setTimeout(() => window.print(), 500);
        }
    </script>
